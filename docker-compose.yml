version: '3.8'

services:
  pyxelart:
    build: .
    container_name: pyxelart-app
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
    environment:
      - PORT=${PORT:-5001}
    volumes:
      # Persist uploaded files and outputs
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./presets:/app/presets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-5001}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
